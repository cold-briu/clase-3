<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Chat — Neo Brutalist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Compact Nav -->
  <header class="navbar">
    <div class="logo">
      <span>ROOM.CHAT</span>
      <span class="badge">v1.0</span>
    </div>
    <div class="nav-links">
      <div class="online-tag">
        <span class="dot"></span>
        <span id="activeCount">6 online</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="app-box">
      <!-- Box Topbar -->
      <div class="box-header">
        <span class="box-title" id="boxTitle">Public Channel #general</span>
        <div id="headerActions" class="header-actions">
          <span class="bot-badge" id="botBadge" title="Gemini Bot status">🤖 Bot Active</span>
          <button id="botSettingsBtn" class="btn-icon" title="Configure Gemini Bot">⚙️</button>
          <div id="userProfile" class="user-profile hidden">
            <img id="userAvatar" class="user-avatar" src="" alt="avatar">
            <span class="status-text" id="statusLabel">guest</span>
            <button id="signOutBtn" class="btn-signout" title="Sign out">Log Out</button>
          </div>
        </div>
      </div>

      <!-- Welcome / Join View -->
      <section id="welcomeView" class="view-panel welcome-panel">
        <h1 class="hero-title">Talk to anyone. Minimal.</h1>
        <p class="hero-subtitle">Sign in with Google to enter the secure room.</p>
        
        <div class="auth-box">
          <button type="button" class="btn-brutal btn-google" id="googleLoginBtn">
            <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Continue with Google</span>
          </button>
          <div id="authErrorMsg" class="auth-error hidden"></div>
        </div>
      </section>

      <!-- Chat View -->
      <section id="chatView" class="view-panel chat-panel hidden">
        <div class="messages-list" id="messagesList">
          <!-- Messages will be injected here -->
        </div>

        <form id="chatForm" class="chat-input-bar" autocomplete="off">
          <input 
            type="text" 
            id="messageInput" 
            class="input-brutal" 
            placeholder="Say something..." 
            maxlength="280"
            required
          >
          <button type="submit" class="btn-brutal" id="sendBtn">Send</button>
        </form>
      </section>
    </div>
  </main>

  <!-- Bot Settings Modal -->
  <div id="botModal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">🤖 Gemini Bot Config</span>
        <button id="closeModalBtn" class="btn-close">&times;</button>
      </div>
      <div class="modal-body">
        <p class="modal-desc">
          Powered by Gemini Flash (<code>gemini-3.8-flash</code>).
          The bot automatically replies to messages in the chat.
        </p>
        <label for="geminiApiKeyInput" class="modal-label">Google AI Studio API Key:</label>
        <input 
          type="password" 
          id="geminiApiKeyInput" 
          class="input-brutal" 
          placeholder="AIzaSy..." 
          autocomplete="off"
        >
        <div class="modal-checkbox-row">
          <label>
            <input type="checkbox" id="botEnabledToggle" checked> Enable Bot auto-reply
          </label>
        </div>
        <div class="modal-actions">
          <button id="saveBotConfigBtn" class="btn-brutal">Save & Apply</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
